<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Know Your Holes Series · WholeClass</title>
<meta name="theme-color" content="#01434B">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png?v=2">
<link rel="manifest" href="manifest.json?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Manrope:wght@400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<script src="./cloud.js"></script>
<script src="./listen.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#FEF9F2;color:#2A3446;font-family:'Manrope',system-ui,sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:#01434B;color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
header a{color:#fff;text-decoration:none;font-weight:700;font-size:14px;padding:6px 4px}
header .t{flex:1;min-width:0;font-family:'Sora',sans-serif;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
main{max-width:720px;margin:0 auto;padding:22px 20px 80px}
.kicker{font-family:'Sora',sans-serif;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#8A5A00;margin:8px 0 0}
h1{font-family:'Sora',sans-serif;color:#01434B;font-size:28px;line-height:1.2;margin:6px 0 14px}
.book{font-family:'Source Serif 4',Georgia,serif;font-size:18px;line-height:1.7}
.book p{margin:0 0 14px}
.book li{margin:6px 0}
.book .cue{font-family:'Manrope',sans-serif;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#8A5A00;margin:22px 0 6px}
.hero{background:#01434B;color:#fff;border-radius:20px;padding:20px;margin:6px 0 16px}
.hero h1{color:#fff;margin:4px 0 6px}
.hero p{color:#CFE3E1;line-height:1.55;margin:0}
.hero .kicker{color:#E9B53F}
.buy{display:block;width:100%;border:none;border-radius:999px;padding:15px;margin-top:14px;font:700 15px 'Sora',sans-serif;cursor:pointer;background:linear-gradient(135deg,#E9B53F,#C48504);color:#2A1C00}
.buy:disabled{opacity:.6}
.pill{display:inline-block;border-radius:999px;padding:4px 11px;font-size:12px;font-weight:800;background:#1A6A70;color:#fff;margin-top:12px}
.toc a{display:flex;justify-content:space-between;gap:10px;align-items:center;background:#fff;border:1px solid #EADFCB;border-radius:14px;padding:13px 14px;margin-bottom:8px;text-decoration:none;color:#01434B;font-weight:700}
.toc small{font-weight:700;color:#0E6B6B;white-space:nowrap}
.toc small.lock{color:#8A5A00}
.nav{display:flex;gap:10px;margin-top:34px}
.nav a{flex:1;text-align:center;border-radius:999px;padding:13px;font-weight:700;text-decoration:none;font-family:'Sora',sans-serif;font-size:14px}
.btn{background:#01434B;color:#fff}
.btn2{border:1.5px solid #01434B;color:#01434B;background:#fff}
.note{background:#fff;border:1px solid #EADFCB;border-radius:16px;padding:18px;margin-top:10px;line-height:1.55}
.msg{border-radius:12px;padding:11px 13px;margin:0 0 14px;font-size:14px;line-height:1.45}
.msg.ok{background:#E3F2F1;color:#0A5656}.msg.err{background:#FDECEA;color:#8A1F11}
.lbtn{display:inline-flex;align-items:center;gap:8px;border:none;border-radius:999px;padding:12px 20px;background:#01434B;color:#fff;font:700 15px 'Sora',sans-serif;cursor:pointer;margin:0 0 20px}
.copy{font-size:12px;color:#5A6478;margin-top:40px;text-align:center}
</style>
</head>
<body>
<header>
  <a href="./" aria-label="Back to WholeClass">‹ Class</a>
  <div class="t" id="hdr">The Know Your Holes Series</div>
  <a href="listen.html" aria-label="All lessons">Lessons</a>
</header>
<main id="main"><p>Opening the Series…</p></main>
<script>
(function(){
  const main = document.getElementById('main'), hdr = document.getElementById('hdr');
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const money = n => '$' + (Number(n) % 1 ? Number(n).toFixed(2) : Number(n));
  const fmtDate = d => new Date(d).toLocaleDateString('en-US', {month:'long', day:'numeric', year:'numeric'});
  const label = n => n === 0 ? 'Introduction' : 'Chapter ' + n;
  let notice = '';

  async function buy(btn){
    btn.disabled = true; btn.textContent = 'Opening checkout…';
    try { await WC.checkout('series'); }
    catch (e) { btn.disabled = false; btn.textContent = 'Get the full Series'; alertBox(e.message || 'Checkout could not start.'); }
  }
  function alertBox(t){ const d = document.createElement('div'); d.className = 'msg err'; d.textContent = t; main.prepend(d); window.scrollTo(0, 0); }
  function buyPanel(a){
    return '<div class="hero"><p class="kicker">Open the full Series</p><h1 style="font-size:22px">All 14 audio lessons</h1><p>Your Introduction and Chapter 1 are free. Chapters 2 to 13 open with one payment of <b style="color:#fff">' + money(a.series_price) + '</b> for one year. No automatic renewal.</p><button class="buy" id="buyBtn">Get the full Series · ' + money(a.series_price) + '</button></div>';
  }
  function wireBuy(){ const b = document.getElementById('buyBtn'); if (b) b.onclick = () => buy(b); }

  async function run(){
    const q = new URLSearchParams(location.search);
    const s = await WC.session();
    if (!s) { main.innerHTML = '<p class="kicker">Audio lessons</p><h1>The Know Your Holes Series</h1><div class="note">The Series opens inside your WholeClass account. The Introduction and Chapter 1 are free.<br><a href="./" style="display:inline-block;margin-top:12px;background:#01434B;color:#fff;border-radius:999px;padding:11px 18px;font-weight:700;text-decoration:none">Sign in or create a free account</a></div>'; return; }
    const paid = q.get('paid');
    if (paid) {
      history.replaceState(null, '', 'listen.html');
      main.innerHTML = '<p>Confirming your payment…</p>';
      try { const r = await WC.confirmPayment(paid); notice = r.status === 'paid' ? '<div class="msg ok">Payment received. Your Series is open for one year.</div>' : '<div class="msg err">That payment did not go through. Nothing was charged.</div>'; }
      catch (e) { notice = '<div class="msg err">' + esc(e.message || 'We could not confirm the payment.') + '</div>'; }
    }
    if (q.get('canceled')) { history.replaceState(null, '', 'listen.html'); notice = '<div class="msg ok">Checkout canceled. Nothing was charged.</div>'; }
    const [a, list] = await Promise.all([WC.access(), WC.seriesContents()]);
    const n = q.get('n');
    if (n === null || n === '') return contents(a, list);
    return lesson(+n, a, list);
  }

  function contents(a, list){
    hdr.textContent = 'The Know Your Holes Series';
    const open = !!a.series_unlocked;
    main.innerHTML = notice + '<div class="hero"><p class="kicker">Audio lessons · C.P. Parker</p><h1>The Know Your Holes Series</h1><p>Listen your way through the ideas in <em>Know Your Holes</em>, with real situations and reflection pauses. It\'s a separate course that adds to the book and the 14-Day Discovery Class.</p>' +
      (open ? '<span class="pill">Open until ' + fmtDate(a.series_expires_at) + '</span>' : '<button class="buy" id="buyBtn">Get the full Series · ' + money(a.series_price) + ' for one year</button><p style="font-size:12.5px;margin-top:8px">The Introduction and Chapter 1 are free. One payment, no automatic renewal.</p>') + '</div>' +
      '<div class="toc">' + list.map(l => '<a href="listen.html?n=' + l.n + '"><span>' + (l.n === 0 ? '' : l.n + '. ') + esc(l.title) + '</span><small' + (l.free || open ? '' : ' class="lock"') + '>' + (l.free ? 'Free' : (open ? '🔊 Listen' : 'Locked')) + '</small></a>').join('') + '</div>' +
      (list.length ? '' : '<div class="note">Lessons are on the way. Check back soon.</div>');
    wireBuy();
  }

  async function lesson(n, a, list){
    const meta = list.find(l => l.n === n);
    if (!meta) { main.innerHTML = '<h1>Lesson not found</h1><p><a href="listen.html">See all lessons</a></p>'; return; }
    hdr.textContent = label(n);
    document.title = label(n) + ': ' + meta.title + ' · Know Your Holes Series';
    const i = list.findIndex(l => l.n === n), prev = list[i - 1], next = list[i + 1];
    const nav = '<div class="nav">' + (prev ? '<a class="btn2" href="listen.html?n=' + prev.n + '">‹ ' + label(prev.n) + '</a>' : '<a class="btn2" href="listen.html">All lessons</a>') +
      (next ? '<a class="btn" href="listen.html?n=' + next.n + '">' + label(next.n) + ' ›</a>' : '<a class="btn" href="listen.html">All lessons</a>') + '</div>';
    const head = notice + '<p class="kicker">The Know Your Holes Series · ' + label(n) + '</p><h1>' + esc(meta.title) + '</h1>';
    const row = await WC.lesson(n);
    if (!row) { main.innerHTML = head + buyPanel(a) + nav; wireBuy(); return; }
    main.innerHTML = head + (WCListen.supported ? '<button class="lbtn" id="listenBtn">🔊 Listen to this lesson</button>' : '<div class="note" style="margin-bottom:16px">This device can\'t read aloud, but you can read the lesson below.</div>') +
      '<div class="book">' + row.html + '</div>' + nav + '<p class="copy">© Merch Corporation. All rights reserved. For your personal listening in WholeClass.</p>';
    if (WCListen.supported) WCListen.setup({ n, title: meta.title, main, keyPrefix: 'wc-series-', headPrefix: n === 0 ? 'Introduction. ' : 'Chapter ' + n + '. ' });
    window.scrollTo(0, 0);
  }

  run().catch(e => { main.innerHTML = '<h1>Could not open the Series</h1><p>' + esc(e.message || e) + '</p><p><a href="listen.html">Try again</a></p>'; });
})();
</script>
</body>
</html>
