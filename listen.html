<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Know Your Holes Series · WholeClass</title>
<meta name="theme-color" content="#01434B">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png?v=2">
<link rel="manifest" href="manifest.json?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="./cloud.js"></script>
<script src="./awake.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#FEF9F2;color:#2A3446;font-family:'Manrope',system-ui,sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:#01434B;color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
header a{color:#fff;text-decoration:none;font-weight:700;font-size:14px;padding:6px 4px}
header .t{flex:1;min-width:0;font-family:'Sora',sans-serif;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
main{max-width:720px;margin:0 auto;padding:22px 20px 80px}
.kicker{font-family:'Sora',sans-serif;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#8A5A00;margin:8px 0 0}
h1{font-family:'Sora',sans-serif;color:#01434B;font-size:28px;line-height:1.2;margin:6px 0 14px}
.hero{background:#01434B;color:#fff;border-radius:20px;padding:20px;margin:6px 0 16px}
.hero h1{color:#fff;margin:4px 0 6px}
.hero p{color:#CFE3E1;line-height:1.55;margin:0}
.hero .kicker{color:#E9B53F}
.buy{display:block;width:100%;border:none;border-radius:999px;padding:15px;margin-top:14px;font:700 15px 'Sora',sans-serif;cursor:pointer;background:linear-gradient(135deg,#E9B53F,#C48504);color:#2A1C00}
.buy:disabled{opacity:.6}
.pill{display:inline-block;border-radius:999px;padding:4px 11px;font-size:12px;font-weight:800;background:#1A6A70;color:#fff;margin-top:12px}
.ep{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid #EADFCB;border-radius:16px;padding:12px 14px;margin-bottom:8px;text-decoration:none;color:#01434B}
.ep .num{width:42px;height:42px;flex:none;border-radius:12px;background:#E8F0EF;color:#01434B;display:flex;align-items:center;justify-content:center;font:800 15px 'Sora',sans-serif}
.ep.ready .num{background:#01434B;color:#fff}
.ep .info{flex:1;min-width:0}
.ep .ti{font-weight:800;font-size:15px}
.ep .sub{font-size:12.5px;color:#5A6478;font-weight:600;margin-top:2px}
.ep .tag{font-size:12px;font-weight:800;white-space:nowrap;color:#0E6B6B}
.ep .tag.lock{color:#8A5A00}.ep .tag.soon{color:#7A8598}
.ep.soon{opacity:.75}
.player{background:#fff;border:1px solid #EADFCB;border-radius:20px;padding:18px;margin-top:6px}
.player audio{width:100%;margin-top:4px}
.ctrls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.ctrls button{font:700 14px 'Manrope',sans-serif;border-radius:999px;border:1.5px solid #01434B;background:#fff;color:#01434B;padding:9px 14px;cursor:pointer}
.ctrls button.on{background:#01434B;color:#fff}
.ctrls .sp{flex:1}
.nav{display:flex;gap:10px;margin-top:28px}
.nav a{flex:1;text-align:center;border-radius:999px;padding:13px;font-weight:700;text-decoration:none;font-family:'Sora',sans-serif;font-size:14px}
.btn{background:#01434B;color:#fff}.btn2{border:1.5px solid #01434B;color:#01434B;background:#fff}
.note{background:#fff;border:1px solid #EADFCB;border-radius:16px;padding:18px;margin-top:10px;line-height:1.55}
.msg{border-radius:12px;padding:11px 13px;margin:0 0 14px;font-size:14px;line-height:1.45}
.msg.ok{background:#E3F2F1;color:#0A5656}.msg.err{background:#FDECEA;color:#8A1F11}
.copy{font-size:12px;color:#5A6478;margin-top:40px;text-align:center}
</style>
</head>
<body>
<header>
  <a href="./" aria-label="Back to WholeClass">‹ Class</a>
  <div class="t" id="hdr">The Know Your Holes Series</div>
  <a href="listen.html" aria-label="All seasons">Seasons</a>
</header>
<main id="main"><p>Opening the Series…</p></main>
<script>
(function(){
  const main = document.getElementById('main'), hdr = document.getElementById('hdr');
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const money = n => '$' + (Number(n) % 1 ? Number(n).toFixed(2) : Number(n));
  const fmtDate = d => new Date(d).toLocaleDateString('en-US', {month:'long', day:'numeric', year:'numeric'});
  const mins = s => s ? Math.max(1, Math.round(s / 60)) + ' min' : '';
  const clock = s => { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  const SERIES = 'The Know Your Holes Series';
  const epLink = (sn, n) => 'listen.html?s=' + sn + '&ep=' + n;
  let notice = '';

  async function buy(btn){
    const sn = +btn.dataset.season || 1, label = btn.textContent;
    btn.disabled = true; btn.textContent = 'Opening checkout…';
    try { await WC.checkout('series', sn); }
    catch (e) { btn.disabled = false; btn.textContent = label; const d = document.createElement('div'); d.className = 'msg err'; d.textContent = e.message || 'Checkout could not start.'; main.prepend(d); window.scrollTo(0, 0); }
  }
  const wireBuy = () => main.querySelectorAll('[data-season].buy').forEach(b => b.onclick = () => buy(b));

  async function run(){
    const q = new URLSearchParams(location.search);
    const s = await WC.session();
    if (!s) { main.innerHTML = '<p class="kicker">' + SERIES + '</p><h1>Season 1: The Missing Fit</h1><div class="note">The Series plays inside your WholeClass account. Episode 1 of every season is free.<br><a href="./" style="display:inline-block;margin-top:12px;background:#01434B;color:#fff;border-radius:999px;padding:11px 18px;font-weight:700;text-decoration:none">Sign in or create a free account</a></div>'; return; }
    const sq = +q.get('s') || 0, paid = q.get('paid');
    if (paid) {
      history.replaceState(null, '', 'listen.html' + (sq ? '?s=' + sq : ''));
      main.innerHTML = '<p>Confirming your payment…</p>';
      try { const r = await WC.confirmPayment(paid); notice = r.status === 'paid' ? '<div class="msg ok">Payment received. Season ' + (sq || 1) + ' is open for one year.</div>' : '<div class="msg err">That payment did not go through. Nothing was charged.</div>'; }
      catch (e) { notice = '<div class="msg err">' + esc(e.message || 'We could not confirm the payment.') + '</div>'; }
    }
    if (q.get('canceled')) { history.replaceState(null, '', 'listen.html' + (sq ? '?s=' + sq : '')); notice = '<div class="msg ok">Checkout canceled. Nothing was charged.</div>'; }
    const seasons = await WC.episodes();
    const n = q.get('ep');
    if (n === null || n === '') return list(seasons, sq);
    return episode(sq || 1, +n, seasons);
  }

  function tagFor(e, open){
    if (!e.ready) return '<span class="tag soon">Coming soon</span>';
    if (e.free) return '<span class="tag">▶ Free</span>';
    return open ? '<span class="tag">▶ Play</span>' : '<span class="tag lock">🔒 Locked</span>';
  }
  const epTitle = e => e.title ? esc(e.title) : (e.ready ? 'Episode ' + e.n : 'Coming soon');

  function seasonBlock(se){
    const eps = se.episodes || [], ready = eps.filter(e => e.ready).length;
    return '<section id="season-' + se.season + '" style="margin-top:22px">' +
      '<div class="hero"><p class="kicker">Season ' + se.season + '</p><h1>' + esc(se.title) + '</h1>' + (se.blurb ? '<p>' + esc(se.blurb) + '</p>' : '') +
      (se.unlocked ? '<span class="pill">Open until ' + fmtDate(se.expires_at) + '</span>'
        : '<button class="buy" data-season="' + se.season + '">Open Season ' + se.season + ' · ' + money(se.price) + ' for one year</button><p style="font-size:12.5px;margin-top:8px">Episode 1 is free. One payment, no automatic renewal.</p>') + '</div>' +
      '<p style="font-size:13px;color:#5A6478;margin:0 0 10px">' + ready + ' of ' + eps.length + ' episodes available' + (ready < eps.length ? '. New episodes appear here as they are released.' : '.') + '</p>' +
      eps.map(e => {
        const sub = e.ready ? ['Episode ' + e.n, mins(e.duration_sec)].filter(Boolean).join(' · ') : 'Episode ' + e.n;
        const inner = '<div class="num">' + e.n + '</div><div class="info"><div class="ti">' + epTitle(e) + '</div><div class="sub">' + sub + '</div></div>' + tagFor(e, se.unlocked);
        return e.ready ? '<a class="ep ready" href="' + epLink(se.season, e.n) + '">' + inner + '</a>' : '<div class="ep soon" aria-disabled="true">' + inner + '</div>';
      }).join('') + '</section>';
  }

  function list(seasons, sq){
    hdr.textContent = SERIES;
    document.title = SERIES + ' · WholeClass';
    const jump = seasons.length > 1 ? '<div style="display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 0">' + seasons.map(se => '<a href="#season-' + se.season + '" style="border:1.5px solid #01434B;border-radius:999px;padding:7px 13px;font-weight:700;font-size:13px;color:#01434B;text-decoration:none">Season ' + se.season + '</a>').join('') + '</div>' : '';
    main.innerHTML = notice + '<p class="kicker">C.P. Parker</p><h1 style="margin-bottom:4px">' + SERIES + '</h1>' +
      '<p style="color:#5A6478;line-height:1.5;margin:0 0 6px">Audio seasons of real situations that show how holes shape the way we love, argue and choose. Each season is its own one-year purchase, and Episode 1 of every season is free.</p>' + jump +
      (seasons.length ? seasons.map(seasonBlock).join('') : '<div class="note">The first season is coming soon.</div>');
    wireBuy();
    if (sq) { const el = document.getElementById('season-' + sq); if (el) el.scrollIntoView(); }
  }

  async function episode(sn, n, seasons){
    const se = seasons.find(x => x.season === sn), eps = se ? se.episodes : [], e = eps.find(x => x.n === n);
    if (!se || !e) { main.innerHTML = '<h1>Episode not found</h1><p><a href="listen.html">See all seasons</a></p>'; return; }
    const title = e.title || (e.ready ? 'Episode ' + n : 'Coming soon');
    hdr.textContent = 'Season ' + sn + ' · Episode ' + n;
    document.title = 'S' + sn + ' E' + n + ': ' + title + ' · ' + se.title;
    const ready = eps.filter(x => x.ready), i = ready.findIndex(x => x.n === n), prev = ready[i - 1], next = ready[i + 1];
    const back = 'listen.html?s=' + sn;
    const nav = '<div class="nav">' + (prev ? '<a class="btn2" href="' + epLink(sn, prev.n) + '">‹ Episode ' + prev.n + '</a>' : '<a class="btn2" href="' + back + '">All episodes</a>') +
      (next ? '<a class="btn" href="' + epLink(sn, next.n) + '">Episode ' + next.n + ' ›</a>' : '<a class="btn" href="' + back + '">All episodes</a>') + '</div>';
    const head = notice + '<p class="kicker">Season ' + sn + ': ' + esc(se.title) + ' · Episode ' + n + '</p><h1>' + esc(title) + '</h1>';
    if (!e.ready) { main.innerHTML = head + '<div class="note">This episode is coming soon. Check back here, it will appear as soon as it is released.</div>' + nav; return; }
    if (!e.path) {
      main.innerHTML = head + '<div class="hero"><p class="kicker">Open Season ' + sn + '</p><h1 style="font-size:22px">' + esc(se.title) + ': all ' + eps.length + ' episodes</h1><p>Episode 1 is free. Every other episode in this season opens with one payment of <b style="color:#fff">' + money(se.price) + '</b> for one year. No automatic renewal.</p><button class="buy" data-season="' + sn + '">Open Season ' + sn + ' · ' + money(se.price) + '</button></div>' + nav;
      wireBuy(); return;
    }
    main.innerHTML = head + '<div class="player"><div style="font-size:13px;color:#5A6478;font-weight:700">' + [mins(e.duration_sec), 'C.P. Parker'].filter(Boolean).join(' · ') + '</div>' +
      '<audio id="au" controls preload="metadata" controlsList="nodownload"></audio>' +
      '<div class="ctrls"><button id="back15" aria-label="Back 15 seconds">↺ 15</button><button id="fwd15" aria-label="Forward 15 seconds">15 ↻</button><span class="sp"></span>' +
      ['0.8','1','1.25','1.5'].map(r => '<button data-r="' + r + '">' + r + '×</button>').join('') + '</div>' +
      '<div class="ctrls"><button id="awake" aria-pressed="true">☀ Screen stays on</button></div>' +
      '<div id="sleepTip" style="font-size:12.5px;color:#5A6478;margin-top:8px;line-height:1.45"></div>' +
      '<div id="resume" style="font-size:12.5px;color:#5A6478;margin-top:10px"></div></div>' + nav +
      '<p class="copy">© Merch Corporation. All rights reserved. For your personal listening in WholeClass.</p>';
    const au = document.getElementById('au'), key = 'wc-ep-pos-' + (sn === 1 ? n : sn + '-' + n);
    try { au.src = await WC.episodeUrl(e.path); } catch (er) { document.getElementById('resume').textContent = 'This episode could not be loaded. Check your connection and try again.'; return; }
    let rate = 1; try { rate = +localStorage.getItem('wc-ep-rate') || 1; } catch (er) {}
    const setRate = r => { rate = r; au.playbackRate = r; document.querySelectorAll('[data-r]').forEach(b => b.classList.toggle('on', +b.dataset.r === r)); try { localStorage.setItem('wc-ep-rate', r); } catch (er) {} };
    document.querySelectorAll('[data-r]').forEach(b => b.onclick = () => setRate(+b.dataset.r));
    setRate(rate);
    document.getElementById('back15').onclick = () => { au.currentTime = Math.max(0, au.currentTime - 15); };
    document.getElementById('fwd15').onclick = () => { au.currentTime = Math.min(au.duration || 1e9, au.currentTime + 15); };
    let saved = 0; try { saved = +localStorage.getItem(key) || 0; } catch (er) {}
    au.addEventListener('loadedmetadata', () => {
      au.playbackRate = rate;
      if (saved > 10 && saved < (au.duration || 0) - 10) { au.currentTime = saved; document.getElementById('resume').textContent = 'Picking up where you left off at ' + clock(saved) + '.'; }
    });
    let last = 0;
    au.addEventListener('timeupdate', () => { if (Math.abs(au.currentTime - last) > 5) { last = au.currentTime; try { localStorage.setItem(key, Math.floor(au.currentTime)); } catch (er) {} } });
    au.addEventListener('ended', () => { try { localStorage.removeItem(key); } catch (er) {} document.getElementById('resume').innerHTML = next ? 'Finished. <a href="' + epLink(sn, next.n) + '" style="color:#0E6B6B;font-weight:800">Play Episode ' + next.n + ' ›</a>' : 'Finished. That is the latest episode in this season for now.'; });
    au.addEventListener('ratechange', () => { if (au.playbackRate !== rate) setRate(au.playbackRate); });
    // Sleep mode: keep the screen on while playing, and explain the iPhone home-screen limit
    const A = window.WCAwake, awBtn = document.getElementById('awake'), tipEl = document.getElementById('sleepTip');
    const showAwake = () => {
      const on = A && A.enabled();
      awBtn.setAttribute('aria-pressed', on ? 'true' : 'false'); awBtn.classList.toggle('on', !!on);
      awBtn.textContent = on ? '☀ Screen stays on' : '☾ Screen can sleep';
      tipEl.innerHTML = A && A.isIPhoneHomeApp
        ? (on ? 'The screen stays on while the episode plays. ' : '') + 'On iPhone, episodes opened from the home-screen icon pause when the phone locks. To listen with the screen locked, open <b>wholeclass.app</b> in Safari and play the episode there.'
        : on ? 'The screen stays on while the episode plays. Tap the button to let it sleep and keep listening on the lock screen.' : 'You can lock the phone and keep listening, with controls on the lock screen.';
    };
    if (A && A.supported) { awBtn.onclick = () => { A.setEnabled(!A.enabled()); showAwake(); if (!au.paused) A.on(); }; showAwake(); }
    else { awBtn.hidden = true; if (A && A.isIPhoneHomeApp) showAwake(); }
    au.addEventListener('play', () => { if (A) A.on(); });
    au.addEventListener('pause', () => { if (A) A.off(); });
    au.addEventListener('ended', () => { if (A) A.off(); });
    if ('mediaSession' in navigator) {
      try {
        navigator.mediaSession.metadata = new MediaMetadata({ title: 'S' + sn + ' E' + n + ': ' + title, artist: 'C.P. Parker', album: SERIES + ', Season ' + sn + ': ' + se.title,
          artwork: [{ src: 'icons/icon-512.png?v=2', sizes: '512x512', type: 'image/png' }] });
        navigator.mediaSession.setActionHandler('play', () => au.play());
        navigator.mediaSession.setActionHandler('pause', () => au.pause());
        navigator.mediaSession.setActionHandler('seekbackward', () => { au.currentTime = Math.max(0, au.currentTime - 15); });
        navigator.mediaSession.setActionHandler('seekforward', () => { au.currentTime = au.currentTime + 15; });
      } catch (er) {}
    }
    window.scrollTo(0, 0);
  }

  run().catch(e => { main.innerHTML = '<h1>Could not open the Series</h1><p>' + esc(e.message || e) + '</p><p><a href="listen.html">Try again</a></p>'; });
})();
</script>
</body>
</html>
