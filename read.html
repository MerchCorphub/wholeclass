<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Know Your Holes · WholeClass</title>
<meta name="theme-color" content="#01434B">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Manrope:wght@400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<script src="./cloud.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#FEF9F2;color:#2A3446;font-family:'Manrope',system-ui,sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:#01434B;color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
header a,header button{color:#fff;text-decoration:none;font-weight:700;font-size:14px;background:none;border:none;cursor:pointer;padding:6px 4px;font-family:inherit}
header .t{flex:1;min-width:0;font-family:'Sora',sans-serif;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
main{max-width:720px;margin:0 auto;padding:22px 20px 80px}
.kicker{font-family:'Sora',sans-serif;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#8A5A00;margin:8px 0 0}
h1{font-family:'Sora',sans-serif;color:#01434B;font-size:28px;line-height:1.2;margin:6px 0 18px}
.book{font-family:'Source Serif 4',Georgia,serif;font-size:18px;line-height:1.7}
.book h2{font-family:'Sora',sans-serif;color:#01434B;font-size:20px;margin:28px 0 8px}
.book p{margin:0 0 14px}
.book li{margin:6px 0}
.book li p{margin:0}
.book hr{border:none;border-top:1px solid #EADFCB;margin:26px 0}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:14px -4px 20px;border:1px solid #EADFCB;border-radius:12px;background:#fff}
.book table{border-collapse:collapse;font-family:'Manrope',sans-serif;font-size:14px;line-height:1.45;min-width:620px;width:100%}
.book th,.book td{border-bottom:1px solid #F0E8DA;padding:9px 10px;text-align:left;vertical-align:top}
.book th{background:#E8F0EF;color:#01434B;font-size:13px}
.book tr.hit{background:#FFF4DE;outline:2px solid #C48504;outline-offset:-2px}
.book table p{margin:0}
.toc a{display:flex;justify-content:space-between;gap:10px;align-items:center;background:#fff;border:1px solid #EADFCB;border-radius:14px;padding:13px 14px;margin-bottom:8px;text-decoration:none;color:#01434B;font-weight:700}
.toc small{font-weight:700;color:#5A6478;white-space:nowrap}
.toc .lock{color:#8A5A00}
.cover{display:flex;gap:16px;align-items:center;margin:6px 0 18px}
.cover img{width:86px;border-radius:6px;box-shadow:0 8px 18px rgba(1,38,43,.25)}
.nav{display:flex;gap:10px;margin-top:34px}
.nav a{flex:1;text-align:center;border-radius:999px;padding:13px;font-weight:700;text-decoration:none;font-family:'Sora',sans-serif;font-size:14px}
.btn{background:#01434B;color:#fff}
.btn2{border:1.5px solid #01434B;color:#01434B;background:#fff}
.note{background:#fff;border:1px solid #EADFCB;border-radius:16px;padding:18px;margin-top:10px;line-height:1.55}
.note a{display:inline-block;margin-top:12px;background:#01434B;color:#fff;border-radius:999px;padding:11px 18px;font-weight:700;text-decoration:none}
.size{display:flex;gap:2px}
.copy{font-size:12px;color:#5A6478;margin-top:40px;text-align:center}
.speaking{background:#FFF4DE;box-shadow:0 0 0 6px #FFF4DE;border-radius:4px}
.listen{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#01434B;color:#fff;padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:none}
.listen.on{display:block}
.listen .in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:8px}
.listen button,.listen select{font:700 14px 'Manrope',sans-serif;border-radius:999px;border:1.5px solid #2A6E74;background:#0A525A;color:#fff;padding:9px 12px;cursor:pointer}
.listen .play{background:#E9B53F;border-color:#E9B53F;color:#2A1C00;min-width:92px}
.listen .where{flex:1;min-width:0;font-size:12.5px;color:#CFE3E1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.listen select{padding:8px 6px;max-width:120px}
.lbtn{display:inline-flex;align-items:center;gap:8px;border:none;border-radius:999px;padding:11px 18px;background:#01434B;color:#fff;font:700 14px 'Sora',sans-serif;cursor:pointer;margin:0 0 18px}
body.listening main{padding-bottom:120px}
@media (max-width:420px){.listen .where{display:none}}
</style>
</head>
<body>
<header>
  <a href="./" aria-label="Back to WholeClass">‹ Class</a>
  <div class="t" id="hdr">Know Your Holes</div>
  <div class="size"><button id="smaller" aria-label="Smaller text">A−</button><button id="bigger" aria-label="Larger text">A+</button></div>
</header>
<main id="main"><p>Opening the book…</p></main>
<div class="listen" id="lbar" role="region" aria-label="Listen to this chapter"><div class="in">
  <button id="lPrev" aria-label="Back one paragraph">⏮</button>
  <button class="play" id="lPlay">▶ Play</button>
  <button id="lNext" aria-label="Forward one paragraph">⏭</button>
  <span class="where" id="lWhere" aria-live="polite"></span>
  <select id="lRate" aria-label="Reading speed"><option value="0.8">0.8×</option><option value="1" selected>1×</option><option value="1.2">1.2×</option><option value="1.5">1.5×</option></select>
  <button id="lClose" aria-label="Close the player">✕</button>
</div></div>
<script>
(function(){
  const main = document.getElementById('main'), hdr = document.getElementById('hdr');
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  let size = 18; try { size = +localStorage.getItem('wc-read-size') || 18; } catch (e) {}
  const applySize = () => { document.querySelectorAll('.book').forEach(b => b.style.fontSize = size + 'px'); try { localStorage.setItem('wc-read-size', size); } catch (e) {} };
  document.getElementById('smaller').onclick = () => { size = Math.max(14, size - 1); applySize(); };
  document.getElementById('bigger').onclick = () => { size = Math.min(26, size + 1); applySize(); };
  const dayFor = n => (n >= 1 && n <= 14) ? 'Day ' + n : 'Start here';

  async function run(){
    const s = await WC.session();
    if (!s) { main.innerHTML = '<p class="kicker">Know Your Holes</p><h1>Sign in to read</h1><div class="note">The book opens inside your WholeClass account. Your note from the author and Chapter 1 are free.<br><a href="./">Sign in or create a free account</a></div>'; return; }
    const list = await WC.bookContents();
    const ch = new URLSearchParams(location.search).get('ch');
    if (ch === null || ch === '') return toc(list);
    const n = +ch, meta = list.find(c => c.n === n);
    if (!meta) { main.innerHTML = '<h1>Chapter not found</h1><p><a href="read.html">See all chapters</a></p>'; return; }
    const row = await WC.chapter(n);
    hdr.textContent = n === 0 ? 'A Note for My Reader' : 'Chapter ' + n;
    document.title = (n === 0 ? meta.title : 'Chapter ' + n + ': ' + meta.title) + ' · Know Your Holes';
    const i = list.findIndex(c => c.n === n), prev = list[i - 1], next = list[i + 1];
    const navHtml = '<div class="nav">' + (prev ? '<a class="btn2" href="read.html?ch=' + prev.n + '">‹ ' + (prev.n === 0 ? 'Note' : 'Chapter ' + prev.n) + '</a>' : '<a class="btn2" href="read.html">Contents</a>') +
      (next ? '<a class="btn" href="read.html?ch=' + next.n + '">' + 'Chapter ' + next.n + ' ›</a>' : '<a class="btn" href="./">Back to my class</a>') + '</div>';
    const head = '<p class="kicker">' + (n === 0 ? 'Know Your Holes · C.P. Parker' : 'Chapter ' + n + ' · ' + dayFor(n)) + '</p><h1>' + esc(meta.title) + '</h1>';
    if (!row) {
      main.innerHTML = head + '<div class="note">This chapter opens with the full 14-Day Discovery Class. Your note from the author and Chapter 1 are free.<br><a href="./">Open the full class</a></div>' + navHtml;
      return;
    }
    const canSpeak = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
    main.innerHTML = head + (canSpeak ? '<button class="lbtn" id="listenBtn" aria-label="Listen to this chapter">🔊 Listen to this chapter</button>' : '') + '<div class="book">' + row.html + '</div>' + navHtml + '<p class="copy">© Merch Corporation. All rights reserved. For your personal reading in WholeClass.</p>';
    main.querySelectorAll('.book table').forEach(t => { const w = document.createElement('div'); w.className = 'tw'; t.parentNode.insertBefore(w, t); w.appendChild(t); });
    applySize();
    if (canSpeak) setupListen(n, meta.title);
    if (location.hash) { const el = document.getElementById(decodeURIComponent(location.hash.slice(1))); if (el) { el.classList.add('hit'); setTimeout(() => el.scrollIntoView({ block: 'center' }), 50); } }
    else window.scrollTo(0, 0);
  }
  // ---------- Listen: reads the chapter aloud with the device's built-in voice ----------
  function setupListen(n, title){
    const synth = window.speechSynthesis, bar = document.getElementById('lbar');
    const book = main.querySelector('.book');
    const clean = t => t.replace(/_{3,}/g, ' blank ').replace(/[“”]/g, '"').replace(/\s+/g, ' ').trim();
    // one item per paragraph, list item, heading or table row
    const items = [];
    const addText = (el, text) => {
      text = clean(text); if (!text || !/[A-Za-z0-9]/.test(text)) return;
      // long paragraphs are split by sentence so no single utterance runs too long
      const parts = text.length > 280 ? (text.match(/[^.!?]+[.!?]+["')\]]*\s*|[^.!?]+$/g) || [text]) : [text];
      let buf = '';
      parts.forEach(pt => { if ((buf + pt).length > 280 && buf) { items.push({el, text: buf.trim()}); buf = ''; } buf += pt; });
      if (buf.trim()) items.push({el, text: buf.trim()});
    };
    addText(main.querySelector('h1'), (n === 0 ? '' : 'Chapter ' + n + '. ') + title + (/[.!?]$/.test(title) ? '' : '.'));
    book.querySelectorAll('p, li, h2, h3, tr').forEach(el => {
      if (el.tagName === 'P' && el.closest('li, td, th')) return;
      if (el.tagName === 'LI' && el.querySelector('li')) { // read only this item's own text, nested items come next
        const c = el.cloneNode(true); c.querySelectorAll('ul,ol').forEach(x => x.remove()); return addText(el, c.textContent);
      }
      if (el.tagName === 'TR') {
        const table = el.closest('table'); const heads = Array.from(table.querySelectorAll('thead th')).map(th => clean(th.textContent));
        if (el.closest('thead')) return;
        const cells = Array.from(el.children).map(td => clean(td.textContent));
        return addText(el, cells.map((c, i) => i === 0 || !heads[i] ? c : heads[i] + ': ' + c).join('. ') + '.');
      }
      addText(el, el.textContent);
    });
    if (!items.length) return;
    const key = 'wc-listen-' + n;
    let i = 0, playing = false, voice = null, rate = 1;
    try { i = Math.min(+localStorage.getItem(key) || 0, items.length - 1); rate = +localStorage.getItem('wc-listen-rate') || 1; } catch (e) {}
    document.getElementById('lRate').value = String(rate);
    const pickVoice = () => {
      const vs = synth.getVoices().filter(v => /^en(-|_|$)/i.test(v.lang));
      voice = vs.find(v => /en-US/i.test(v.lang) && /natural|enhanced|premium|samantha|google us/i.test(v.name)) || vs.find(v => /en-US/i.test(v.lang)) || vs[0] || null;
    };
    pickVoice(); if (synth.onvoiceschanged !== undefined) synth.onvoiceschanged = pickVoice;
    const mark = () => {
      document.querySelectorAll('.speaking').forEach(x => x.classList.remove('speaking'));
      const it = items[i]; if (!it) return;
      it.el.classList.add('speaking');
      const r = it.el.getBoundingClientRect();
      if (r.top < 70 || r.bottom > innerHeight - 110) it.el.scrollIntoView({block: 'center', behavior: 'smooth'});
      document.getElementById('lWhere').textContent = 'Part ' + (i + 1) + ' of ' + items.length;
      try { localStorage.setItem(key, i); } catch (e) {}
    };
    const playBtn = document.getElementById('lPlay');
    const setBtn = () => { playBtn.textContent = playing ? '❚❚ Pause' : '▶ Play'; };
    let token = 0;
    const speak = () => {
      const my = ++token; synth.cancel();
      if (i >= items.length) { playing = false; setBtn(); i = 0; document.getElementById('lWhere').textContent = 'Finished this chapter'; try { localStorage.removeItem(key); } catch (e) {} return; }
      mark();
      const u = new SpeechSynthesisUtterance(items[i].text);
      if (voice) u.voice = voice; u.lang = voice ? voice.lang : 'en-US'; u.rate = rate;
      u.onend = () => { if (my !== token || !playing) return; i++; speak(); };
      u.onerror = e => { if (my !== token || !playing || e.error === 'interrupted' || e.error === 'canceled') return; i++; speak(); };
      synth.speak(u);
    };
    const play = () => { playing = true; setBtn(); speak(); };
    const pause = () => { playing = false; token++; synth.cancel(); setBtn(); }; // stop and resume from the same part (pause() is unreliable on some phones)
    const open = () => { bar.classList.add('on'); document.body.classList.add('listening'); };
    document.getElementById('listenBtn').onclick = () => { open(); play(); };
    playBtn.onclick = () => playing ? pause() : play();
    document.getElementById('lPrev').onclick = () => { i = Math.max(0, i - 1); playing ? speak() : mark(); };
    document.getElementById('lNext').onclick = () => { i = Math.min(items.length - 1, i + 1); playing ? speak() : mark(); };
    document.getElementById('lRate').onchange = e => { rate = +e.target.value; try { localStorage.setItem('wc-listen-rate', rate); } catch (er) {} if (playing) speak(); };
    document.getElementById('lClose').onclick = () => { pause(); bar.classList.remove('on'); document.body.classList.remove('listening'); document.querySelectorAll('.speaking').forEach(x => x.classList.remove('speaking')); };
    // tap any paragraph while the player is open to listen from there
    book.addEventListener('click', e => { if (!bar.classList.contains('on')) return; const el = e.target.closest('p, li, h2, h3, tr'); const j = items.findIndex(it => it.el === el || it.el.contains(el)); if (j >= 0) { i = j; playing ? speak() : mark(); } });
    addEventListener('pagehide', () => synth.cancel());
    if (i > 0) document.getElementById('listenBtn').textContent = '🔊 Keep listening where you left off';
  }

  function toc(list){
    hdr.textContent = 'Know Your Holes';
    main.innerHTML = '<div class="cover"><img src="assets/kyh-cover.jpg" alt="Know Your Holes book cover"><div><p class="kicker">The book</p><h1 style="margin:4px 0 2px">Know Your Holes</h1><div style="color:#5A6478;font-weight:600">C.P. Parker · Merch Corporation</div></div></div>' +
      '<p style="line-height:1.55">Each day of the 14-Day Discovery Class has a chapter to go with it. Day 1 reads Chapter 1, Day 2 reads Chapter 2, and so on.</p>' +
      '<div class="toc">' + list.map(c => '<a href="read.html?ch=' + c.n + '"><span>' + (c.n === 0 ? '' : c.n + '. ') + esc(c.title) + '</span><small' + (c.free ? '' : ' class="lock"') + '>' + (c.free ? (c.n === 0 ? 'Free' : 'Free · Day 1') : dayFor(c.n)) + '</small></a>').join('') + '</div>' +
      (list.length ? '' : '<div class="note">The book has not been loaded yet. Check back soon.</div>');
  }
  run().catch(e => { main.innerHTML = '<h1>Could not open the book</h1><p>' + esc(e.message || e) + '</p><p><a href="read.html">Try again</a></p>'; });
})();
</script>
</body>
</html>
